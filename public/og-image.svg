<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c3035;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0f3e42;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#07252a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F2D675;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F2D675;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A07820;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  
  <!-- Stars -->
  <circle cx="100" cy="100" r="3" fill="#F2D675" opacity="0.8" />
  <circle cx="200" cy="80" r="2" fill="#D4AF37" opacity="0.6" />
  <circle cx="300" cy="120" r="2.5" fill="#F2D675" opacity="0.7" />
  <circle cx="400" cy="90" r="2" fill="#D4AF37" opacity="0.5" />
  <circle cx="500" cy="110" r="3" fill="#F2D675" opacity="0.9" />
  <circle cx="600" cy="70" r="2" fill="#D4AF37" opacity="0.6" />
  <circle cx="700" cy="100" r="2.5" fill="#F2D675" opacity="0.8" />
  <circle cx="800" cy="85" r="2" fill="#D4AF37" opacity="0.7" />
  <circle cx="900" cy="115" r="3" fill="#F2D675" opacity="0.6" />
  <circle cx="1000" cy="75" r="2.5" fill="#D4AF37" opacity="0.8" />
  <circle cx="1100" cy="105" r="2" fill="#F2D675" opacity="0.7" />
  
  <!-- Moon -->
  <circle cx="150" cy="200" r="80" fill="url(#moonGrad)" />
  <circle cx="180" cy="160" r="70" fill="url(#bgGrad)" />
  
  <!-- Arabic Text -->
  <text x="600" y="250" font-family="Amiri, serif" font-size="80" fill="url(#textGrad)" text-anchor="middle">عيد مبارك</text>
  
  <!-- English Text -->
  <text x="600" y="320" font-family="Cinzel Decorative, serif" font-size="60" fill="url(#textGrad)" text-anchor="middle" font-weight="900">Eid Mubarak</text>
  
  <!-- Subtitle -->
  <text x="600" y="380" font-family="Nunito, sans-serif" font-size="24" fill="#F5E6C8" text-anchor="middle" opacity="0.8">Create & Share Personalized Eid Cards</text>
  
  <!-- Lanterns -->
  <g transform="translate(1000, 450)">
    <rect x="0" y="0" width="40" height="8" rx="4" fill="#D4AF37" />
    <ellipse cx="20" cy="35" rx="18" ry="25" fill="#D4AF37" opacity="0.7" />
    <ellipse cx="20" cy="20" rx="12" ry="10" fill="#D4AF37" opacity="0.4" />
    <ellipse cx="20" cy="35" rx="10" ry="18" fill="rgba(255,255,220,0.25)" />
    <rect x="16" y="43" width="8" height="8" rx="2" fill="#D4AF37" opacity="0.55" />
    <line x1="18" y1="51" x2="17" y2="58" stroke="#D4AF37" stroke-width="2" />
    <line x1="22" y1="51" x2="23" y2="58" stroke="#D4AF37" stroke-width="2" />
  </g>
  
  <g transform="translate(950, 480)">
    <rect x="0" y="0" width="50" height="10" rx="5" fill="#F2D675" />
    <ellipse cx="25" cy="45" rx="22" ry="30" fill="#F2D675" opacity="0.12" />
    <ellipse cx="25" cy="25" rx="15" ry="12" fill="#F2D675" opacity="0.4" />
    <ellipse cx="25" cy="45" rx="12" ry="22" fill="#FFF9D6" opacity="0.88" />
    <circle cx="25" cy="45" r="5" fill="#FFFFFF" opacity="0.38" />
    <rect x="20" y="55" width="10" height="10" rx="3" fill="#F2D675" />
    <line x1="22" y1="65" x2="21" y2="72" stroke="#F2D675" stroke-width="2.5" />
    <line x1="28" y1="65" x2="29" y2="72" stroke="#F2D675" stroke-width="2.5" />
  </g>
</svg>